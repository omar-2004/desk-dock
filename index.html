<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Desk">
  <title>Desk Dock</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="grid">
    <!-- Column 1: time -->
    <section class="card col-time">
      <div>
        <div id="time" class="time">--:--</div>
        <div id="date" class="date"></div>
        <div id="world" class="world"></div>
      </div>
      <blockquote id="quote" class="quote"></blockquote>
    </section>

    <!-- Column 2: weather -->
    <section class="card col-weather">
      <div class="weather-now">
        <span id="w-icon" class="w-icon">·</span>
        <div>
          <div id="w-temp" class="w-temp">--°</div>
          <div id="w-desc" class="muted">Loading weather…</div>
        </div>
      </div>
      <div id="w-details" class="w-details"></div>
      <h2>Next hours</h2>
      <div id="w-hourly" class="w-hourly"></div>
      <h2>Next days</h2>
      <div id="w-daily" class="w-daily"></div>
    </section>

    <!-- Column 3: productivity -->
    <div class="col-stack">
      <section class="card focus-card">
        <div>
          <h2>Timer · <span id="pomo-mode">Focus</span></h2>
          <div id="pomo-time" class="pomo-time">25:00</div>
        </div>
        <div class="row">
          <button id="pomo-start" type="button">Start</button>
          <button id="pomo-reset" type="button" class="ghost">Reset</button>
        </div>
      </section>

      <section class="card tabs-card">
        <nav id="tabs" class="tabs">
          <button type="button" data-tab="todo">To-do</button>
          <button type="button" data-tab="habits">Habits</button>
          <button type="button" data-tab="countdowns">Countdowns</button>
          <button type="button" data-tab="notes">Notes</button>
        </nav>

        <div class="panel" data-panel="todo">
          <form id="todo-form" class="row">
            <input id="todo-input" placeholder="Add a task…" autocomplete="off" maxlength="120">
            <button type="submit">Add</button>
          </form>
          <ul id="todo-list" class="list"></ul>
        </div>

        <div class="panel" data-panel="habits" hidden>
          <form id="habit-form" class="row">
            <input id="habit-input" placeholder="New habit…" autocomplete="off" maxlength="60">
            <button type="submit">Add</button>
          </form>
          <ul id="habit-list" class="list"></ul>
        </div>

        <div class="panel" data-panel="countdowns" hidden>
          <form id="cd-form" class="row">
            <input id="cd-name" placeholder="Event…" autocomplete="off" maxlength="60">
            <input id="cd-date" type="date" class="date-input">
            <button type="submit">Add</button>
          </form>
          <ul id="cd-list" class="list"></ul>
        </div>

        <div class="panel" data-panel="notes" hidden>
          <textarea id="notes" placeholder="Quick notes…"></textarea>
        </div>
      </section>
    </div>
  </main>

  <!-- Night mode overlay: tap to wake -->
  <div id="night" class="night" hidden>
    <div id="night-time" class="night-time"></div>
    <div id="night-date" class="night-date"></div>
  </div>

  <div class="toolbar">
    <button id="night-btn" type="button" class="ghost" aria-label="Night mode">☾</button>
    <button id="settings-btn" type="button" class="ghost" aria-label="Settings">⚙︎</button>
  </div>

  <dialog id="settings">
    <form id="settings-form">
      <h2>Settings</h2>
      <label class="field">Weather city <input id="s-city" autocomplete="off"></label>
      <div class="field">
        <span>World clocks (up to 3 cities)</span>
        <input id="s-world-0" autocomplete="off">
        <input id="s-world-1" autocomplete="off">
        <input id="s-world-2" autocomplete="off">
      </div>
      <label class="check"><input id="s-h24" type="checkbox"> 24-hour clock</label>
      <label class="check"><input id="s-night-auto" type="checkbox"> Auto night mode</label>
      <div class="row">
        <label class="field">From <input id="s-night-start" type="time"></label>
        <label class="field">To <input id="s-night-end" type="time"></label>
      </div>
      <div class="field">
        <span>Backup (saved on this device only)</span>
        <div class="row">
          <button type="button" id="s-export" class="ghost">Export settings.json</button>
          <label class="file-btn">Import…
            <input id="s-import" type="file" accept="application/json,.json" class="visually-hidden">
          </label>
        </div>
      </div>
      <div id="s-error" class="error"></div>
      <div class="row">
        <button type="submit" id="s-save">Save</button>
        <button type="button" id="s-cancel" class="ghost">Cancel</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
